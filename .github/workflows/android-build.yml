name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure stable debug signing
        run: |
          base64 --decode ci/emuall-debug.keystore.b64 > ci/emuall-debug.keystore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify native cores are packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libemuall_frontend.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmgba_libretro.so'
          ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/x86_64/'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: EmuAll-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
